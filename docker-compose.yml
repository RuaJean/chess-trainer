services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chess}
      POSTGRES_DB: chess_trainer
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chess_trainer"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://chess:${DB_PASSWORD:-chess}@db:5432/chess_trainer
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      WHISPER_MODEL: ${WHISPER_MODEL:-large-v3-turbo}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: .
    ports:
      - "8888:80"
    depends_on:
      - backend

volumes:
  pgdata:
